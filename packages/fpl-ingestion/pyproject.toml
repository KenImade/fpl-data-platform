[project]
name = "fpl-ingestion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kenneth Imade", email = "kenneth.imade@yahoo.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "adbc-driver-postgresql>=1.12.0",
    "boto3>=1.43.57",
    "botocore>=1.43.57",
    "dagster>=1.13.15",
    "dagster-dbt~=0.29.15",
    "dagster-postgres>=0.29.15",
    "dagster-webserver>=1.13.15",
    "dbt-core>=1.11,<1.12",
    "dbt-postgres>=1.11,<1.12",
    "fpl-modelling",
    "httpx>=0.28.1",
    "polars>=1.43.1",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []

[tool.uv.sources]
fpl-modelling = { workspace = true }
