version: 2

models:
  - name: stg_player_gameweek_stats
    description: >
      Discrete per-gameweek FPL fields. Grained at player x gameweek, NOT per
      fixture — double gameweeks are aggregated. See ADR 0005.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, player_id, gameweek]
    columns:
      - name: player_id
        tests: [not_null]
      - name: gameweek
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 38
      - name: minutes
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 270
      - name: points
        tests: [not_null]
  
  - name: stg_matches
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id]
    columns:
      - name: match_id
        tests: [not_null]
      - name: competition
        tests: [not_null]
      - name: home_team_code
        tests:
          - not_null:
              config:
                where: "is_league"
      - name: away_team_code
        tests:
          - not_null:
              config:
                where: "is_league"
      - name: kickoff_utc
        tests:
          - not_null:
              config:
                where: "is_league"
                severity: warn

  - name: stg_playermatchstats
    description: >
      Per-match player performance. The only per-fixture grain available.
      Lacks cards, own goals, penalties saved and bonus — those are
      gameweek-level only, which is why the fact table needs both sources.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, player_id]
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_matches')
                field: match_id
      - name: player_id
        tests: [not_null]
      - name: competition
        tests: [not_null]
      - name: minutes
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
  
  - name: stg_players
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, player_code]
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, player_id]
    columns:
      - name: player_code
        tests: [not_null]
      - name: position
        tests:
          - not_null:
              config:
                where: "season != '2024-2025'"
          - accepted_values:
              arguments:
                values: ['GKP', 'DEF', 'MID', 'FWD']
  
  - name: stg_teams
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, team_code]
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, team_id]
    columns:
      - name: team_code
        tests: [not_null]
      - name: team_name
        tests: [not_null]