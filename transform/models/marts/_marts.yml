version: 2

models:
  - name: fct_player_gw
    description: >
      One row per player per gameweek per fixture. Per-fixture columns are
      true at this grain; gw_* columns are populated only on the first
      fixture of a gameweek (is_gw_primary) because they cannot be allocated
      across a double gameweek. See ADR 0005.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, match_id, player_id]
    columns:
      - name: player_code
        tests: [not_null]
      - name: position
        tests:
          - accepted_values:
              arguments:
                values: ['GKP', 'DEF', 'MID', 'FWD']
      - name: is_gw_primary
        tests: [not_null]
      - name: minutes
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
      - name: match_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_matches')
                field: match_id
  
  - name: dim_person
    description: >
      One row per human being, keyed on player_code — FPL's identifier that
      persists across seasons.

      This exists because player_id does not. FPL reassigns element IDs each
      August, so a cross-season join on player_id will attach one player's
      history to whoever inherited their number. dim_person is the join
      target for anything spanning more than a single season: career form,
      historical per-90 rates, a player's record against a given opponent.

      Descriptive fields (name, position, club) come from the most recent
      season the person appears in, because all three change. Names get
      re-rendered, players are reclassified between positions, and clubs move
      players. Anything needing the value *as at* a particular season should
      join stg_players on (player_code, season) rather than reading it here.

      first_season and last_season bound the career AS OBSERVED IN THIS
      WAREHOUSE, not in reality. Coverage begins at 2024/25, so a player
      active for a decade before that still shows first_season = 2024-2025.

      has_changed_position flags a modelling hazard rather than a curiosity:
      a defender reclassified as a midfielder accrued their historical
      per-90 rates under different scoring rules and different defensive
      contribution thresholds, so their history is not directly comparable
      to their present.
    columns:
      - name: player_code
        description: >
          FPL's stable cross-season identifier. The grain of this table and
          the correct key for any historical join.
        tests: [not_null]
      - name: current_position
        description: Position in the most recent observed season, not necessarily historical.
        tests:
          - accepted_values:
              arguments:
                values: ['GKP', 'DEF', 'MID', 'FWD']
      - name: first_season
        description: Earliest season observed here — a coverage boundary, not a debut.
      - name: has_changed_position
        description: >
          True if the person appears under more than one position across
          observed seasons. Their historical rates were accrued under
          different scoring rules.
  
  - name: fct_team_fixture
    description: >
      One row per team per match, so two rows per fixture. Unpivoted from
      stg_matches because almost everything at team level is asymmetric:
      goals for and against, home advantage, Elo, rest days.
      Includes ALL competitions deliberately. Fixture congestion and European
      fatigue are computed across everything a team played, and those have no
      other available source. Filter on is_league for anything scoring-related.
      Rows for non-Premier League clubs are dropped — we have no identity for
      them and their rest days are not a feature. The English side of every
      European tie survives.
      Elo is the rating AT KICKOFF, not a season snapshot, so it carries no
      leakage from future form. That is what makes it usable as a prior for
      the match model.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, team_code]
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_matches')
                field: match_id
      - name: team_code
        description: Always populated — non-PL clubs are excluded from this table.
        tests: [not_null]
      - name: opponent_code
        description: >
          NULL for European and cup fixtures, where the opposition is not a
          Premier League club. That is information, not missing data.
      - name: is_home
        tests: [not_null]
      - name: is_league
        tests: [not_null]
      - name: result
        description: NULL for fixtures not yet played.
        tests:
          - accepted_values:
              arguments:
                values: ['W', 'D', 'L']
      - name: goals_for
        tests:
          - not_null:
              config:
                # Unplayed fixtures legitimately have no score. 2026/27's
                # full fixture list is loaded before a ball is kicked.
                where: "result is not null"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 15
      - name: elo
        description: Elo at kickoff. Point-in-time, no leakage.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1000
                max_value: 2500
                config:
                  where: "elo is not null"
      - name: days_since_last_match
        description: >
          Across all competitions. NULL for a team's first fixture of a
          season, and wherever kickoff_utc is missing — 2025/26 GW34-38 and
          unscheduled knockouts.
        tests:
           - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 200
                config:
                  # Pre-season friendlies legitimately run same-day when a
                  # squad splits. Upstream also carries 13 GW33 fixtures
                  # stamped 2025-09-25 19:00:00, a placeholder that makes
                  # rest days meaningless for those teams — reported, not
                  # yet fixed at source.
                  where: "is_league and days_since_last_match is not null"
                  severity: warn
