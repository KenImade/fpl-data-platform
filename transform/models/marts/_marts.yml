version: 2

models:
  - name: fct_player_gw
    description: >
      One row per player per gameweek per fixture. Per-fixture columns are
      true at this grain; gw_* columns are populated only on the first
      fixture of a gameweek (is_gw_primary) because they cannot be allocated
      across a double gameweek. See ADR 0005.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, match_id, player_id]
    columns:
      - name: player_code
        tests: [not_null]
      - name: position
        tests:
          - accepted_values:
              arguments:
                values: ['GKP', 'DEF', 'MID', 'FWD']
      - name: is_gw_primary
        tests: [not_null]
      - name: minutes
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
                config:
                  # Friendlies do not follow match-length conventions —
                  # pre-season fixtures run long and squads split across two
                  # games. The 120 ceiling is a rule about competitive
                  # football, so it is asserted only where it applies.
                  where: "competition != 'friendly'"
      - name: match_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_matches')
                field: match_id
  
  - name: dim_person
    description: >
      One row per human being, keyed on player_code — FPL's identifier that
      persists across seasons.

      This exists because player_id does not. FPL reassigns element IDs each
      August, so a cross-season join on player_id will attach one player's
      history to whoever inherited their number. dim_person is the join
      target for anything spanning more than a single season: career form,
      historical per-90 rates, a player's record against a given opponent.

      Descriptive fields (name, position, club) come from the most recent
      season the person appears in, because all three change. Names get
      re-rendered, players are reclassified between positions, and clubs move
      players. Anything needing the value *as at* a particular season should
      join stg_players on (player_code, season) rather than reading it here.

      first_season and last_season bound the career AS OBSERVED IN THIS
      WAREHOUSE, not in reality. Coverage begins at 2024/25, so a player
      active for a decade before that still shows first_season = 2024-2025.

      has_changed_position flags a modelling hazard rather than a curiosity:
      a defender reclassified as a midfielder accrued their historical
      per-90 rates under different scoring rules and different defensive
      contribution thresholds, so their history is not directly comparable
      to their present.
    columns:
      - name: player_code
        description: >
          FPL's stable cross-season identifier. The grain of this table and
          the correct key for any historical join.
        tests: [not_null]
      - name: current_position
        description: Position in the most recent observed season, not necessarily historical.
        tests:
          - accepted_values:
              arguments:
                values: ['GKP', 'DEF', 'MID', 'FWD']
      - name: first_season
        description: Earliest season observed here — a coverage boundary, not a debut.
      - name: has_changed_position
        description: >
          True if the person appears under more than one position across
          observed seasons. Their historical rates were accrued under
          different scoring rules.
  
  - name: fct_team_fixture
    description: >
      One row per team per match, so two rows per fixture. Unpivoted from
      stg_matches because almost everything at team level is asymmetric:
      goals for and against, home advantage, Elo, rest days.
      Includes ALL competitions deliberately. Fixture congestion and European
      fatigue are computed across everything a team played, and those have no
      other available source. Filter on is_league for anything scoring-related.
      Rows for non-Premier League clubs are dropped — we have no identity for
      them and their rest days are not a feature. The English side of every
      European tie survives.
      Elo is the rating AT KICKOFF, not a season snapshot, so it carries no
      leakage from future form. That is what makes it usable as a prior for
      the match model.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, team_code]
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_matches')
                field: match_id
      - name: team_code
        description: Always populated — non-PL clubs are excluded from this table.
        tests: [not_null]
      - name: opponent_code
        description: >
          NULL for European and cup fixtures, where the opposition is not a
          Premier League club. That is information, not missing data.
      - name: is_home
        tests: [not_null]
      - name: is_league
        tests: [not_null]
      - name: result
        description: NULL for fixtures not yet played.
        tests:
          - accepted_values:
              arguments:
                values: ['W', 'D', 'L']
      - name: goals_for
        tests:
          - not_null:
              config:
                # Unplayed fixtures legitimately have no score. 2026/27's
                # full fixture list is loaded before a ball is kicked.
                where: "result is not null"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 15
      - name: elo
        description: Elo at kickoff. Point-in-time, no leakage.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1000
                max_value: 2500
                config:
                  where: "elo is not null"
      - name: days_since_last_match
        description: >
          Across all competitions. NULL for a team's first fixture of a
          season, and wherever kickoff_utc is missing — 2025/26 GW34-38 and
          unscheduled knockouts.
        tests:
           - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 200
                config:
                  # Pre-season friendlies legitimately run same-day when a
                  # squad splits. Upstream also carries 13 GW33 fixtures
                  # stamped 2025-09-25 19:00:00, a placeholder that makes
                  # rest days meaningless for those teams — reported, not
                  # yet fixed at source.
                  where: "is_league and days_since_last_match is not null"
                  severity: warn
  
  - name: fct_deadline_snapshot
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_id]
    columns:
      - name: snapshot_id
        tests: [not_null]
      - name: hours_before_deadline
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 3
                config:
                  where: "is_usable"
                  severity: warn
  
  - name: fct_player_snapshot
    description: >
      Player state as at each gameweek deadline. THE point-in-time boundary —
      every predictive feature reads from here. A row exists only if captured
      strictly before its deadline, so leakage is structurally unavailable
      rather than merely avoided.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_id, player_id]
    columns:
      - name: snapshot_id
        tests: [not_null]
      - name: price_tenths
        tests: [not_null]

  - name: dim_team
    description: >
      One row per club per season. The API's read surface for teams — in
      marts rather than the API reading stg_teams, so "the API reads marts"
      stays a simple rule.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, team_code]
    columns:
      - name: team_name
        tests: [not_null]
      - name: matches_played
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 38
                config:
                  where: "matches_played is not null"

  - name: dim_gameweek
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, gameweek]
    columns:
      - name: deadline_utc
        tests: [not_null]
      - name: fixture_count
        description: >
          League matches. Not always 10 — rounds get rescheduled around cup
          and European commitments, so 7 and 13 both occur legitimately.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 15
                config:
                  where: "fixture_count is not null"

  - name: dim_player
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, player_id]
    columns:
      - name: player_code
        tests: [not_null]
      - name: position
        tests:
          - accepted_values:
              arguments:
                values: ['GKP', 'DEF', 'MID', 'FWD']
  
  - name: mart_player_fixture_predictions
    description: >
      Model output shaped for the API, at fixture grain. One row per player per
      league fixture, so a double gameweek gives a player two rows.

      This layer exists so that predictions.player_gameweek is not itself the
      public contract. Without it, every column rename in the modelling package
      would break third-party consumers, and "the API reads marts" would be
      approximately rather than literally true.

      ONE VERSION, CHOSEN DELIBERATELY. predictions.player_gameweek holds every
      version so a challenger can be scored against the same snapshot as the
      incumbent. Serving latest-by-timestamp would throw that away — a training
      run would silently change what consumers receive. predictions.active_model
      names the served version and promotion is a separate act.

      Most components are null: only the minutes model exists so far. A null
      means no model has been built for that component, not a prediction of
      zero, and the API schema says so.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, gameweek, player_id, match_id]
    columns:
      - name: season
        tests: [not_null]
      - name: gameweek
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_matches')
                field: match_id
      - name: position
        tests:
          - accepted_values:
              arguments:
                values: ['GKP', 'DEF', 'MID', 'FWD']
      - name: p_minutes_60
        description: >
          Probability of reaching the 60-minute appearance threshold in this
          fixture. The most load-bearing number the model produces: clean
          sheet points and the second appearance point both hang off it.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: p_minutes_0
        description: Probability of not appearing at all.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: e_minutes
        description: >
          Expected minutes, from band midpoints rather than band labels. What
          the attacking components multiply their per-90 rates by.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 90
      - name: is_cold_start
        description: >
          No prior league appearances this season. The prediction is a
          positional prior rather than an estimate from this player's history,
          and a consumer building a transfer tool deserves to know which they
          are reading.
        tests: [not_null]
      - name: snapshot_id
        description: >
          The feature state this prediction was made from. Rebuild it, rerun
          the version, and the row should come back identical.
        tests: [not_null]
      - name: model_version
        tests: [not_null]
      - name: opponent_name
        description: >
          NULL only where the fixture join failed, which should not happen for
          league fixtures. A null here is worth investigating rather than
          serving.

  - name: mart_player_gameweek_predictions
    description: >
      The API's default prediction surface. One row per player per gameweek,
      aggregated across fixtures.

      A double gameweek gives a player two fixtures, and a consumer asking how
      many points someone will score in GW26 wants one number. Serving fixture
      grain by default would make every consumer implement the aggregation, and
      most would forget — producing tools that silently halve a projection in
      exactly the gameweeks where it matters most.

      EXPECTATIONS SUM, PROBABILITIES DO NOT. E[goals across both] is the sum by
      linearity, whether or not the fixtures are independent. P(60+ minutes) is
      not: what a consumer wants is the probability of clearing the threshold in
      at least one fixture, computed here as 1 - prod(1 - p) under
      independence.

      Independence is not quite right — a player injured in the first fixture
      misses the second — so double-gameweek probabilities are slightly
      overstated. That is documented rather than corrected, because correcting
      it needs a joint model the data does not support. Per-fixture
      probabilities remain available unaggregated at fixture grain.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, gameweek, player_id]
    columns:
      - name: season
        tests: [not_null]
      - name: gameweek
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: fixtures_in_gw
        description: >
          League fixtures this player's club plays this gameweek. 2 marks a
          double; 0 does not occur here, since a player with no fixture has no
          row rather than a zeroed one.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 3
      - name: is_double_gw
        tests: [not_null]
      - name: p_minutes_60
        description: >
          Probability of reaching 60 minutes in AT LEAST ONE fixture. For a
          single gameweek this equals the fixture-level figure; for a double it
          is strictly higher than either fixture alone, which is the property
          the aggregation exists to produce.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: e_minutes
        description: >
          Summed across fixtures, so a double gameweek can exceed 90. That is
          correct — two matches is two chances to accumulate minutes.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 180
      - name: opponents
        description: >
          Comma-separated, with (H) or (A), ordered by kickoff. A double
          gameweek lists both — a fixture ticker needs them in order.
      - name: is_cold_start
        description: >
          True if the player is cold-start in any fixture this gameweek.
        tests: [not_null]
      - name: snapshot_id
        tests: [not_null]
      - name: model_version
        tests: [not_null]