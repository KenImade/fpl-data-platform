[project]
name = "fpl-data-platform"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fpl-core",
    "fpl-api",
]

[tool.uv.workspace]
members = [
    "packages/fpl-api",
    "packages/fpl-core",
    "packages/fpl-ingestion",
    "packages/fpl-modelling",
    "packages/fpl-optimiser",
]

[tool.uv.sources]
fpl-core = { workspace = true }
fpl-api = { workspace = true }


# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection requires these in argument defaults. B008
# exists for mutable defaults evaluated once at import; these are sentinels
# FastAPI resolves per request, and "fixing" them would break the framework.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]


# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
#
# Not strict globally. Strict typing pays for itself on shared domain logic
# that every other package imports; on framework glue it mostly demands
# annotations that satisfy the checker without catching anything.

[tool.mypy]
python_version = "3.13"
mypy_path = [
    "packages/fpl-api/src",
    "packages/fpl-core/src",
    "packages/fpl-ingestion/src",
    "packages/fpl-modelling/src",
    "packages/fpl-optimiser/src",
]
files = [
    "packages/fpl-api/src",
    "packages/fpl-core/src",
    "packages/fpl-ingestion/src",
    "packages/fpl-modelling/src",
    "packages/fpl-optimiser/src",
]

# Third-party packages shipping no type information. Not ours to fix.
[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "adbc_driver_postgresql.*",
    "asyncpg.*",
]
ignore_missing_imports = true

# Strict on the shared domain: rulesets, scoring, money, identity. A bug
# here propagates into ingestion, the API, and eventually the models.
[[tool.mypy.overrides]]
module = "fpl_core.*"
strict = true

# Relaxed across ingestion. Dagster's decorators rewrite the signatures of
# every asset, op and sensor, so annotations there are ceremony.
[[tool.mypy.overrides]]
module = "fpl_ingestion.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
ignore_missing_imports = true

# Relaxed only where FastAPI does the same thing — middleware signatures and
# app wiring. The routers, db and auth stay checked: those are ordinary code
# and the annotations earn their keep.
[[tool.mypy.overrides]]
module = ["fpl_api.errors", "fpl_api.main"]
disallow_untyped_defs = false
disallow_any_generics = false


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
markers = ["integration: requires local Compose services"]
asyncio_mode = "auto"
# asyncpg connections are bound to the event loop that created them, so a
# session-scoped pool needs a session-scoped loop. Without both lines, every
# test after the first gets a pool belonging to a closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"


[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.0",
]