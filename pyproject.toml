[project]
name = "fpl-data-platform"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fpl-core",
    "fpl-api",
]

[tool.uv.workspace]
members = [
    "packages/fpl-api",
    "packages/fpl-core",
    "packages/fpl-ingestion",
    "packages/fpl-modelling",
    "packages/fpl-optimiser",
]

[tool.uv.sources]
fpl-core = { workspace = true }
fpl-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = [
    "packages/fpl-api/src",
    "packages/fpl-core/src",
    "packages/fpl-ingestion/src",
    "packages/fpl-modelling/src",
    "packages/fpl-optimiser/src",
]
files = [
    "packages/fpl-api/src",
    "packages/fpl-core/src",
    "packages/fpl-ingestion/src",
    "packages/fpl-modelling/src",
    "packages/fpl-optimiser/src",
]

[tool.pytest.ini_options]
markers = ["integration: requires local Compose services"]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
