[project]
name = "fpl-data-platform"
version = "0.1.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
fpl-core = {workspace = true}

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages/fpl-core/src"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
]
