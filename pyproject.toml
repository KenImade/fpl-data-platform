[project]
name = "fpl-data-platform"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fpl-core",
    "fpl-api",
]

[tool.uv.workspace]
members = [
    "packages/fpl-api",
    "packages/fpl-core",
    "packages/fpl-ingestion",
    "packages/fpl-modelling",
    "packages/fpl-optimiser",
]

[tool.uv.sources]
fpl-core = { workspace = true }
fpl-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
mypy_path = [
    "packages/fpl-api/src",
    "packages/fpl-core/src",
    "packages/fpl-ingestion/src",
    "packages/fpl-modelling/src",
    "packages/fpl-optimiser/src",
]
files = [
    "packages/fpl-api/src",
    "packages/fpl-core/src",
    "packages/fpl-ingestion/src",
    "packages/fpl-modelling/src",
    "packages/fpl-optimiser/src",
]

# Third-party packages without type information. Not our problem to fix.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "adbc_driver_postgresql.*"]
ignore_missing_imports = true

# Strict on the shared domain logic: rulesets, scoring, money, identity.
# A bug here propagates into every other package.
[[tool.mypy.overrides]]
module = "fpl_core.*"
strict = true

# Relaxed at the Dagster boundary. Decorators rewrite these signatures, so
# annotating them satisfies the checker without catching anything real.
[[tool.mypy.overrides]]
module = ["fpl_ingestion.definitions", "fpl_ingestion.resources"]
disallow_untyped_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "fpl_ingestion.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["integration: requires local Compose services"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection requires Depends() in argument defaults.
# The B008 rule exists for mutable defaults evaluated at import; these are
# sentinels FastAPI resolves per request.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=1.13",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
