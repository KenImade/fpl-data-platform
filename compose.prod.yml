name: fpl

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-dagster-env: &dagster-env
  DAGSTER_HOME: /dagster-home
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER}
  PGPASSWORD: ${POSTGRES_PASSWORD}
  PGDATABASE: dagster
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DBT_DB_HOST: postgres
  DBT_DB_PORT: "5432"
  DBT_DB_USER: ${POSTGRES_USER}
  DBT_DB_PASSWORD: ${POSTGRES_PASSWORD}
  DBT_DATABASE: ${POSTGRES_DB}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET: ${S3_BUCKET}
  USER_AGENT: ${USER_AGENT}
  HEARTBEAT_URL: ${HEARTBEAT_URL}
  DBT_PROJECT_DIR: /app/transform
  DBT_PROFILES_DIR: /app/transform
  ENV: production

services:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
      DAGSTER_DOMAIN: ${DAGSTER_DOMAIN}
      DAGSTER_BASIC_AUTH: ${DAGSTER_BASIC_AUTH}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    deploy:
      resources:
        limits: { memory: 128M }
  
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
      -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    deploy:
      resources:
        limits: { memory: 2G }
  
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 96mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    logging: *logging
    deploy:
      resources:
        limits: { memory: 128M }

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      API_DATABASE_URL: postgresql://${API_DB_USER}:${API_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      GIT_SHA: ${GIT_SHA:-unknown}
      ENV: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    deploy:
      replicas: 2
      resources:
        limits: { memory: 512M }
  
  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    command: dagster-daemon run -m fpl_ingestion.definitions
    environment: *dagster-env
    volumes:
      - dagster_logs:/dagster-home/storage
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    deploy:
      replicas: 1
      resources:
        limits: { memory: 1536M }
  
  dagster-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    command: dagster-webserver -h 0.0.0.0 -p 3000 -m fpl_ingestion.definitions
    environment: *dagster-env
    volumes:
      - dagster_logs:/dagster-home/storage:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    deploy:
      resources:
        limits: { memory: 512M }
  
  backup:
    build:
      context: ./deploy/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      BACKUP_INTERVAL_HOURS: 6
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    deploy:
      resources:
        limits: { memory: 256M }

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  dagster_logs:
      