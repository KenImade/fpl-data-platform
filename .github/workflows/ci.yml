name: CI

on:
  # Every branch, plus PRs. A push to a branch with an open PR triggers both,
  # but the concurrency group below cancels the duplicate rather than paying
  # for it twice.
  push:
  pull_request:
  # Lets the docs be rebuilt without a code change — useful when the dbt
  # manifest changes but no Python does.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a uv release cannot change resolution behaviour mid-week.
  UV_VERSION: "0.5.11"

jobs:
  # ---------------------------------------------------------------------------
  # lint
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-packages

      # The same hooks that run on commit — ruff, ruff-format, gitleaks — as a
      # backstop for anyone who has not run `pre-commit install`.
      #
      # This FAILS rather than fixes. An earlier version applied the fixes and
      # pushed them back, which does not work: commits made with the default
      # GITHUB_TOKEN deliberately do not trigger workflows, so the corrected
      # commit shipped untested while CI stayed red. With the local hook in
      # place a failure here means something bypassed it, and that is worth a
      # human rather than a bot.
      #
      # It also puts gitleaks in CI, where it belongs — a secret scanner that
      # only runs for people who installed a hook is the wrong way round.
      - uses: pre-commit/action@v3.0.1

      # Not in pre-commit: too slow for a commit hook, and it needs the whole
      # resolved dependency set rather than an isolated per-hook environment.
      - run: uv run mypy

      # These two files are derived from the Pydantic models, so a stale one is
      # a real defect rather than a formatting nit — the published field
      # reference would describe an API that no longer exists. Regenerate and
      # diff rather than trusting what is committed.
      - name: Check generated files are current
        run: |
          uv run python scripts/export_openapi.py
          uv run python scripts/gen_data_dictionary.py
          git diff --exit-code -- \
            docs/src/openapi.json \
            docs/src/content/docs/data/dictionary.md

  # ---------------------------------------------------------------------------
  # test
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    # Runs alongside lint rather than after it. A type error and a failing test
    # are independent problems, and finding one should not hide the other.
    #
    # The integration tests skip without API_DATABASE_URL rather than failing,
    # so this is currently the unit suite only. Adding a postgres service here
    # would exercise the SQL and the role grants, which is where the
    # interesting bugs live — see tests/conftest.py.
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-packages

      - run: uv run pytest -q

  # ---------------------------------------------------------------------------
  # docs
  # ---------------------------------------------------------------------------
  docs:
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-packages

      # Regenerated rather than taken from the repo. lint has already asserted
      # the committed copies match, so this is belt and braces — but it costs
      # two seconds and removes any question of what was published.
      - name: Generate docs sources
        run: |
          uv run python scripts/export_openapi.py
          uv run python scripts/gen_data_dictionary.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build documentation
        working-directory: docs
        env:
          PUBLIC_PREMIERLYTICS_API_KEY: ${{ secrets.PUBLIC_PREMIERLYTICS_API_KEY }}
        run: npm run build

      # ONE deploy. An earlier version ran a marketplace rsync action and then
      # a hand-rolled rsync to the same path, both with --delete — tearing the
      # site down and rebuilding it twice per deploy, and doubling the window
      # in which a visitor could hit a missing asset. The SSH configure step
      # also ran after the action that needed it.
      #
      # The hand-rolled version is the one kept: it is transparent, and it is
      # one fewer third-party action holding an SSH key.
      - name: Configure SSH
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOCS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DOCS_HOST }}" >> ~/.ssh/known_hosts

      # --delay-updates stages every file and swaps them at the end, so the
      # served directory is never half-old and half-new. Without it a visitor
      # arriving mid-deploy can request an asset that has been deleted but not
      # yet replaced.
      - name: Deploy documentation
        if: github.ref == 'refs/heads/main'
        run: |
          rsync -az --delete --delay-updates \
            docs/dist/ \
            ${{ secrets.DOCS_USER }}@${{ secrets.DOCS_HOST }}:/srv/docs/